services:
  - type: web
    name: vulcanizadora-don-chuy
    runtime: php
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install --legacy-peer-deps
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      php artisan migrate --force
      php artisan db:seed --class=AdminSeeder --force
      php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_NAME
        value: "Vulcanizadora Don Chuy"
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: IVA_RATE
        value: 0.16
      - key: PAGINATION_PER_PAGE
        value: 15
      - key: PAYMENT_CURRENCY
        value: mxn
      - key: BCRYPT_ROUNDS
        value: 12
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: APP_FAKER_LOCALE
        value: es_MX

databases:
  - name: vulcanizadora-db
    plan: free
    type: mysql
    databaseName: vulcanizadora
    user: vulcanizadora_user
